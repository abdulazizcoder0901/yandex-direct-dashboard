name: Ma'lumotni yangilash

# Har 15 daqiqada Yandex Direct'dan ma'lumot olib, "data" branchiga data.json yozadi.
# Netlify'dagi sayt shu faylni o'qiydi, shuning uchun saytni qayta deploy qilish kerak emas.
on:
  schedule:
    - cron: "*/15 * * * *" # zaxira: GitHub buni soatlab kechiktiradi, asosiy jadval Netlify'da (netlify/functions)
  workflow_dispatch: # Actions sahifasidan qo'lda ishga tushirish

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Yandex Direct'dan ma'lumot olish
        env:
          YANDEX_DIRECT_TOKEN: ${{ secrets.YANDEX_DIRECT_TOKEN }}
          YANDEX_DIRECT_LOGIN: ${{ secrets.YANDEX_DIRECT_LOGIN }}
        run: python scripts/fetch_data.py

      - name: data branchiga yozish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/out" && cp site/data.json "$RUNNER_TEMP/out/data.json"
          cd "$RUNNER_TEMP/out"
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -q -m "Ma'lumot: $(date -u +%Y-%m-%dT%H:%MZ)"
          # Tarix o'smasin: data branchida doim bitta commit
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" data
