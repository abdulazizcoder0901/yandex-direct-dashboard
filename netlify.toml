# Netlify: sayt "site" papkasidan, build kerak emas (ma'lumot GitHub'dagi "data" branchidan o'qiladi)
[build]
  publish = "site"
  command = "echo 'build kerak emas'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# "↻ Yangilash" tugmasi (/api/refresh) va har 15 daqiqalik jadval: GitHub'dagi yangilashni ishga tushiradi.
# Netlify'da GH_ACTIONS_TOKEN muhit o'zgaruvchisi kerak (README'ga qarang).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
